# Host-level nginx in front of the site container (TLS terminates here).
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/host-nginx.conf /etc/nginx/conf.d/game-mafia2.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d game-mafia2.ru -d www.game-mafia2.ru --redirect
#
# certbot adds the "listen 443 ssl" blocks, the certificate paths and the
# http -> https redirect to this file by itself; don't write them by hand.

# www -> canonical host (the site's canonical URLs have no www)
server {
    listen 80;
    listen [::]:80;
    server_name www.game-mafia2.ru;

    # Keep the redirect inside a location: a server-level "return" would also
    # catch /.well-known/acme-challenge/ and break the certbot validation.
    location / {
        return 301 https://game-mafia2.ru$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name game-mafia2.ru;

    location / {
        # The container is published on loopback only: -p 127.0.0.1:8080:80
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
