server {
    listen 80;
    server_name game-mafia2.ru www.game-mafia2.ru _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Redirect with a relative Location: the container sits behind a TLS-terminating
    # reverse proxy, so absolute URLs would downgrade to http:// and leak the inner port.
    absolute_redirect off;

    # канонический вид URL — без трейлинг-слэша (как на старом сайте)
    rewrite ^/(.+)/$ /$1 permanent;

    # старые WP-адреса фидов
    rewrite ^/feed$ /rss.xml permanent;
    rewrite ^/comments/feed$ /rss.xml permanent;

    # /cars/izh-21251.html — сам файл; /cars → cars.html; / → index.html
    # HTML, search.json, rss.xml, sitemap and the rest have stable URLs but change on
    # every deploy. no-cache = "store, but revalidate before use": the browser sends
    # If-None-Match and gets a cheap 304 until the content really changes, so a new
    # deploy is visible at once. Without any Cache-Control browsers cache heuristically
    # (~10% of the file age) and can keep showing stale pages for hours or days.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    # Images keep their original WordPress file names (no content hash), so they are
    # cached for a long time but not marked immutable. A single Cache-Control header:
    # do not combine with "expires", it would add a second one.
    location ~ ^/(uploads|thumbs)/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Astro emits these with a content hash in the file name: safe to cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/rss+xml image/svg+xml text/xml;
    gzip_min_length 1024;
}
