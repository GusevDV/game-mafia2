server {
    listen 80;
    server_name game-mafia2.ru www.game-mafia2.ru _;
    root /usr/share/nginx/html;
    charset utf-8;

    # канонический вид URL — без трейлинг-слэша (как на старом сайте)
    rewrite ^/(.+)/$ /$1 permanent;

    # старые WP-адреса фидов
    rewrite ^/feed$ /rss.xml permanent;
    rewrite ^/comments/feed$ /rss.xml permanent;

    # /cars/izh-21251.html — сам файл; /cars → cars.html; / → index.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/rss+xml image/svg+xml text/xml;
    gzip_min_length 1024;
}
